[project]
name = "tiny-llm-pipeline"
version = "0.1.0"
description = "Template project for ./start.sh new"
requires-python = ">=3.11"

[project.scripts]
tiny-llm-pipeline = "tiny_llm_pipeline.cli:main"

# No dependencies here: they live in the repo-root requirements.txt.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_llm_pipeline"]
