[project]
name = "terminal-coding-agent"
version = "0.1.0"
description = "终端原生 coding agent：自然语言输入，隔离 worktree 内执行，产出 patch"
requires-python = ">=3.11"

[project.scripts]
terminal-coding-agent = "terminal_coding_agent.cli:main"

# 依赖不在这里声明 —— 统一在仓库根 requirements.txt
# 新增依赖：改 requirements.txt，不要散落到子项目。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/terminal_coding_agent"]
