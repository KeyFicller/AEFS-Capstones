[project]
name = "prompt-augment-lens"
version = "0.1.0"
description = "Compare UI questions against model-bound prompt payloads"
requires-python = ">=3.11"

[project.scripts]
prompt-augment-lens = "prompt_augment_lens.cli:main"

# No dependencies here: they live in the repo-root requirements.txt.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_augment_lens"]

[tool.hatch.build.targets.wheel.force-include]
"src/prompt_augment_lens/static" = "prompt_augment_lens/static"
