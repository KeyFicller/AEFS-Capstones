[project]
name = "hello-agent"
version = "0.1.0"
description = "Hello-world 级模板：示意符合 rules 的完成态项目长什么样"
requires-python = ">=3.11"

[project.scripts]
hello-agent = "hello_agent.cli:main"

# 依赖不在这里声明 —— 统一在仓库根 requirements.txt
# 新增依赖：改 requirements.txt，不要散落到子项目。

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]
