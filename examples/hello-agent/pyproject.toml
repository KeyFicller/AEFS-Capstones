[project]
name = "hello-agent"
version = "0.1.0"
description = "Template project for ./start.sh new"
requires-python = ">=3.11"

[project.scripts]
hello-agent = "hello_agent.cli:main"

# No dependencies here: they live in the repo-root requirements.txt.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agent"]
